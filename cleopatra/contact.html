<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - Cleopatra Boudreau</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico?v=2">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon.png?v=2">
    <link rel="apple-touch-icon" href="favicon.png?v=2">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@300;400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <nav>
        <div class="logo"><a href="index.html">Cleopatra Boudreau</a></div>
        <div class="hamburger" onclick="document.querySelector('.nav-links').classList.toggle('show')">
            <span></span><span></span><span></span>
        </div>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="about.html">About</a>
            <a href="reel.html">Demos</a>
            <a href="photos.html">Photos</a>
            <a href="contact.html" class="active">Contact</a>
        </div>
    </nav>

    <main style="flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 1.5rem; padding: 4rem 1.5rem;">
        <h1 class="page-title" style="margin: 0;">Contact</h1>
        <div class="page-content" style="max-width: 600px; width: 100%; display: flex; flex-direction: column; gap: 2rem;">
            
            <div style="background-color: rgba(176, 74, 60, 0.03); border: 1px solid rgba(176, 74, 60, 0.1); border-radius: 24px; padding: 2rem; display: flex; flex-direction: column; gap: 0.75rem;">
                <p style="margin: 0; margin-bottom: 0.5rem; font-family: 'Inter', sans-serif; font-weight: 300; letter-spacing: 3px; font-size: 0.85rem; text-transform: uppercase;">Represented By</p>
                <p style="margin: 0; margin-bottom: 0.5rem; font-size: 2.2rem; font-family: 'Playfair Display', serif; font-weight: 600;">Da Vinci Talent</p>
                <p style="margin: 0; font-size: 1.25rem;">Cha Cha da Vinci</p>
                <p style="margin: 0; font-size: 1rem;"><a href="mailto:davincitalent@gmail.com" style="color: inherit; text-decoration: none;">davincitalent@gmail.com</a></p>
                <p style="margin: 0; font-size: 1.1rem;">514-523-9106</p>
            </div>

            <form name="contact" method="POST" action="thank-you.html" data-netlify="true" style="display: flex; flex-direction: column; gap: 1rem; text-align: left;">
                <input type="hidden" name="form-name" value="contact">
                <input type="hidden" name="subject" id="email-subject" value="[Cleopatra Boudreau Website] New Message">
                <input type="hidden" name="source" value="Cleopatra Boudreau Website">
                <div style="display: flex; flex-direction: column; gap: 0.5rem;">
                    <label for="name" style="font-family: 'Inter', sans-serif; font-size: 0.9rem;">Name</label>
                    <input type="text" id="name" name="name" required style="padding: 0.8rem; border-radius: 8px; border: 1px solid rgba(176, 74, 60, 0.2); background: transparent; font-family: inherit; color: inherit;">
                </div>
                <div style="display: flex; flex-direction: column; gap: 0.5rem;">
                    <label for="email" style="font-family: 'Inter', sans-serif; font-size: 0.9rem;">Email</label>
                    <input type="email" id="email" name="email" required style="padding: 0.8rem; border-radius: 8px; border: 1px solid rgba(176, 74, 60, 0.2); background: transparent; font-family: inherit; color: inherit;">
                </div>
                <div style="display: flex; flex-direction: column; gap: 0.5rem;">
                    <label for="message" style="font-family: 'Inter', sans-serif; font-size: 0.9rem;">Message</label>
                    <textarea id="message" name="message" rows="5" required style="padding: 0.8rem; border-radius: 8px; border: 1px solid rgba(176, 74, 60, 0.2); background: transparent; font-family: inherit; color: inherit; resize: vertical;"></textarea>
                </div>
                <button type="submit" class="contact-submit-btn">Send Message</button>
            </form>
        </div>
    </main>

    <footer>
        <div class="social-links">
            <a href="https://www.instagram.com/cleopatraboudreau/?hl=en" target="_blank" rel="noopener noreferrer">Instagram</a>
            <a href="https://www.imdb.com/name/nm6968367/" target="_blank" rel="noopener noreferrer">IMDb</a>
        </div>
    </footer>

    <script src="script.js"></script>
    <script>
        const nameInput = document.getElementById('name');
        const subjectInput = document.getElementById('email-subject');
        const contactForm = document.querySelector('form[name="contact"]');

        function updateSubject() {
            const name = nameInput.value.trim();
            if (name) {
                subjectInput.value = `[Cleopatra Boudreau Website] New Message from ${name}`;
            } else {
                subjectInput.value = `[Cleopatra Boudreau Website] New Message`;
            }
        }

        if (nameInput && subjectInput && contactForm) {
            nameInput.addEventListener('input', updateSubject);
            contactForm.addEventListener('submit', updateSubject);
        }
    </script>
</body>
</html>
